<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>Strike Machine Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #ffffff; color: #e2e8f0; padding: 24px; min-height: 100vh; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .header h1 { font-size: 18px; font-weight: 600; color: #0080ff; letter-spacing: 0.01em; }
    .header h1 span { color: #38bdf8; }
    .header small { font-size: 11px; color: #063678; display: block; margin-top: 2px; }
    #status { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 99px; font-size: 12px; font-weight: 500; background: #1e293b; color: #64748b; transition: all 0.3s; }
    #status::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #475569; transition: background 0.3s; }
    #status.connected { background: #0f2a1e; color: #4ade80; }
    #status.connected::before { background: #4ade80; box-shadow: 0 0 6px #4ade80; }
    .group-label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #475569; margin: 24px 0 10px; padding-left: 2px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
    .card { background: #efefef; border-radius: 12px; padding: 16px; border: 1px solid #263348; transition: border-color 0.2s; }
    .card:hover { border-color: #334155; }
    .card-title { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: #64748b; margin-bottom: 14px; }
    .pv-row { display: flex; align-items: baseline; gap: 4px; margin-bottom: 10px; }
    .pv-badge { font-size: 10px; font-weight: 700; color: #38bdf8; background: #0c2336; border-radius: 4px; padding: 1px 5px; letter-spacing: 0.04em; flex-shrink: 0; }
    .pv-value { font-size: 30px; font-weight: 600; color: #38bdf8; line-height: 1; font-variant-numeric: tabular-nums; }
    .pv-unit { font-size: 13px; color: #271d07; }
    .sv-row { display: flex; align-items: center; gap: 6px; padding-top: 10px; border-top: 1px solid #263348; }
    .sv-badge { font-size: 10px; font-weight: 700; color: #f59e0b; background: #271d07; border-radius: 4px; padding: 1px 5px; letter-spacing: 0.04em; flex-shrink: 0; }
    .sv-value { font-size: 14px; font-weight: 500; color: #f59e0b; font-variant-numeric: tabular-nums; }
    .sv-unit { font-size: 12px; color: #271d07; }
    #raw-wrap { margin-top: 28px; }
    #raw-wrap summary { font-size: 11px; color: #475569; cursor: pointer; user-select: none; margin-bottom: 8px; letter-spacing: 0.04em; text-transform: uppercase; }
    #raw { background: #1e293b; border-radius: 10px; padding: 14px 16px; font-size: 13px; font-family: 'Consolas', monospace; color: #ffffff; white-space: pre-wrap; max-height: 260px; overflow-y: auto; margin-top: 8px; }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <h1>Strike Machine <span>- Live Monitor</span></h1>
      <small>Author: Nguyen Xuan Tan Tai</small>
    </div>
    <div id="status">Connecting...</div>
  </div>

  <div id="groups"></div>

  <details id="raw-wrap">
    <summary>Raw PLC data</summary>
    <div id="raw">Waiting for data...</div>
  </details>

  <script>
    const GROUPS = [
      {
        label: 'Group A — Pressure & Temperature',
        cards: [
          { title: 'Pressure A',          pvKey: 'P1_Current_PressureHose', svKey: 'P1_PressureSetting',    unit: 'bar' },
          { title: 'Oven',                pvKey: 'T0_Current_Temp',         svKey: 'T0_TemperatureSetting', unit: '°C'  },
          { title: 'Temperature A Front', pvKey: 'P1_Current_Temp1',        svKey: 'P1_TemperatureSetting', unit: '°C'  },
          { title: 'Temperature A Mid',   pvKey: 'P1_Current_Temp2',        svKey: 'P1_TemperatureSetting', unit: '°C'  },
          { title: 'Temperature A End',   pvKey: 'P1_Current_Temp3',        svKey: 'P1_TemperatureSetting', unit: '°C'  },
        ]
      },
      {
        label: 'Group B — Pressure & Temperature',
        cards: [
          { title: 'Pressure B',          pvKey: 'P2_Current_PressureHose', svKey: 'P2_PressureSetting',    unit: 'bar' },
          { title: 'Oven',                pvKey: 'T0_Current_Temp',         svKey: 'T0_TemperatureSetting', unit: '°C'  },
          { title: 'Temperature B Front', pvKey: 'P2_Current_Temp1',        svKey: 'P2_TemperatureSetting', unit: '°C'  },
          { title: 'Temperature B Mid',   pvKey: 'P2_Current_Temp2',        svKey: 'P2_TemperatureSetting', unit: '°C'  },
          { title: 'Temperature B End',   pvKey: 'P2_Current_Temp3',        svKey: 'P2_TemperatureSetting', unit: '°C'  },
        ]
      },
      {
        label: 'Group C — Pressure & Temperature',
        cards: [
          { title: 'Pressure C',          pvKey: 'P3_Current_PressureHose', svKey: 'P3_PressureSetting',    unit: 'bar' },
          { title: 'Oven',                pvKey: 'T0_Current_Temp',         svKey: 'T0_TemperatureSetting', unit: '°C'  },
          { title: 'Temperature C Front', pvKey: 'P3_Current_Temp1',        svKey: 'P3_TemperatureSetting', unit: '°C'  },
          { title: 'Temperature C Mid',   pvKey: 'P3_Current_Temp2',        svKey: 'P3_TemperatureSetting', unit: '°C'  },
          { title: 'Temperature C End',   pvKey: 'P3_Current_Temp3',        svKey: 'P3_TemperatureSetting', unit: '°C'  },
        ]
      },
    ];

    GROUPS.forEach((group, gi) => {
      group.cards.forEach((card, ci) => {
        card._pvId = `pv_${gi}_${ci}`;
        card._svId = `sv_${gi}_${ci}`;
      });
    });

    const groupsEl = document.getElementById('groups');

    GROUPS.forEach((group, gi) => {
      const labelEl = document.createElement('div');
      labelEl.className = 'group-label';
      labelEl.textContent = group.label;
      groupsEl.appendChild(labelEl);

      const grid = document.createElement('div');
      grid.className = 'grid';

      group.cards.forEach((card, ci) => {
        const el = document.createElement('div');
        el.className = 'card';
        el.innerHTML = `
          <div class="card-title">${card.title}</div>
          <div class="pv-row">
            <span class="pv-badge">PV</span>
            <span class="pv-value" id="${card._pvId}">—</span>
            <span class="pv-unit">${card.unit}</span>
          </div>
          <div class="sv-row">
            <span class="sv-badge">SV</span>
            <span class="sv-value" id="${card._svId}">—</span>
            <span class="sv-unit">${card.unit}</span>
          </div>`;
        grid.appendChild(el);
      });

      groupsEl.appendChild(grid);
    });

    const statusEl = document.getElementById('status');
    const rawEl    = document.getElementById('raw');
    const fmt      = v => isNaN(v) ? '—' : parseFloat(v.toFixed(2));

    function connect() {
      const ws = new WebSocket(`wss://${location.host}/ws`);

      ws.onopen = () => {
        statusEl.textContent = 'Connected';
        statusEl.className = 'connected';
      };

      ws.onmessage = (e) => {
        const data = JSON.parse(e.data);

        GROUPS.forEach(group => {
          group.cards.forEach(card => {
            const pvEl = document.getElementById(card._pvId);
            const svEl = document.getElementById(card._svId);
            if (pvEl) pvEl.textContent = fmt(parseFloat(data[card.pvKey] ?? 'NaN'));
            if (svEl) svEl.textContent = fmt(parseFloat(data[card.svKey] ?? 'NaN'));
          });
        });

        rawEl.textContent = JSON.stringify(data, null, 2);
      };

      ws.onclose = () => {
        statusEl.textContent = 'Disconnected – retrying...';
        statusEl.className = '';
        setTimeout(connect, 3000);
      };
    }

    connect();
  </script>
</body>
</html>
